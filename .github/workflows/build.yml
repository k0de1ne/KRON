name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  # llama.cpp release bundled into the Android app (local models).
  LLAMA_CPP: b11500

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, test: true }
          - { os: ubuntu-latest, target: aarch64-linux-android, test: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Android NDK toolchain
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Test
        if: matrix.test
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # llama.cpp's server for local models in the Android app.
      - name: Cache llama-server
        if: matrix.target == 'aarch64-linux-android'
        id: llama
        uses: actions/cache@v4
        with:
          path: llama-server
          key: llama-server-android-${{ env.LLAMA_CPP }}

      - name: Build llama-server
        if: matrix.target == 'aarch64-linux-android' && steps.llama.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch "$LLAMA_CPP" https://github.com/ggml-org/llama.cpp /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+i8mm -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build /tmp/llama-build --target llama-server -j4
          cp /tmp/llama-build/bin/llama-server llama-server
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" llama-server
          ls -la llama-server

      - name: Android app
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}-${{ github.run_number }}
        run: |
          (yes 2>/dev/null || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          android/build.sh target/${{ matrix.target }}/release/kron target/${{ matrix.target }}/release/kron.apk llama-server

      - uses: actions/upload-artifact@v4
        with:
          name: kron-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/kron
            target/${{ matrix.target }}/release/kron.exe
            target/${{ matrix.target }}/release/kron.apk
          if-no-files-found: error

  # Direct download links (no zip, no GitHub login), refreshed on every push:
  # https://github.com/<owner>/<repo>/releases/download/latest/kron.apk
  release:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish the "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir out
          cp kron-aarch64-linux-android/kron.apk out/kron.apk
          cp kron-aarch64-linux-android/kron out/kron-android-arm64
          cp kron-x86_64-unknown-linux-gnu/kron out/kron-linux-x64
          cp kron-x86_64-pc-windows-msvc/kron.exe out/kron-windows-x64.exe
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --prerelease --target "$GITHUB_SHA" \
            --title "latest (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
            --notes "Сборка из ${GITHUB_REF_NAME}. Телефон: скачайте и установите kron.apk."
