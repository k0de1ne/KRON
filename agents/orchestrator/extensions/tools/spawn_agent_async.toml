name        = "spawn_agent_async"
description = "Start a sub-agent in the background. Returns a job_id immediately — use wait_result to collect the answer when ready. Useful for running multiple agents in parallel."
timeout_secs = 10

[parameters]
type     = "object"
required = ["agent", "task"]

[parameters.properties.agent]
type        = "string"
description = "Agent name (folder name inside agents/)"

[parameters.properties.task]
type        = "string"
description = "Task or question to send to the agent"
