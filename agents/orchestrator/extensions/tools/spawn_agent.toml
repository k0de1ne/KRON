name        = "spawn_agent"
description = "Delegate a task to a specialised agent. All agents live in agents/ at the same level. Returns the agent's final response."
timeout_secs = 300

[parameters]
type     = "object"
required = ["agent", "task"]

[parameters.properties.agent]
type        = "string"
description = "Agent name (folder name inside agents/)"

[parameters.properties.task]
type        = "string"
description = "Task or question to send to the agent"
