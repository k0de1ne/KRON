[package]
name = "clients"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "plexus"
path = "src/main.rs"

[features]
#   cargo build --no-default-features             # Q&A only
#   cargo build --no-default-features -F hooks    # Q&A + pre/post хуки
#   cargo build --no-default-features -F loop     # агентный цикл
#   cargo build -F trigger                        # + file watcher
#   cargo build -F full                           # всё включая http
#
default = ["loop", "tools", "hooks", "context"]

loop    = ["dep:agent", "dep:session"]
tools   = ["loop", "agent?/tools"]
hooks   = ["dep:hooks", "agent?/hooks"]      # работает с loop и без
context = ["dep:context", "agent?/context"]  # работает с loop и без
trigger = ["loop", "dep:trigger"]
http    = ["loop", "dep:axum", "dep:tokio-stream", "dep:tower-http", "dep:futures"]
full    = ["loop", "tools", "hooks", "context", "trigger", "http"]

[dependencies]
proto   = { path = "../proto" }
llm     = { path = "../llm" }
agent    = { path = "../agent",    optional = true }
session  = { path = "../session", optional = true }
hooks   = { path = "../hooks",   optional = true }
context = { path = "../context", optional = true }
trigger = { path = "../trigger", optional = true }
anyhow       = { workspace = true }
serde        = { workspace = true }
tokio        = { workspace = true }
clap         = { workspace = true }
serde_json   = { workspace = true }
async-trait  = { workspace = true }
axum         = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
tower-http   = { workspace = true, optional = true }
futures      = { workspace = true, optional = true }
