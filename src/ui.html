<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>kron</title>
<style>
:root { --bg:#fafaf9; --panel:#fff; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#2563eb; --user:#eff6ff; --tool:#f5f5f4; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0c0a09; --panel:#1c1917; --fg:#e7e5e4; --muted:#a8a29e; --line:#292524; --accent:#60a5fa; --user:#172554; --tool:#1c1917; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; display: flex; }
button, select, textarea, input { font: inherit; color: inherit; }
#side { width: 260px; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
#side header { padding: 12px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); }
#side header b { flex: 1; }
#threads { overflow-y: auto; flex: 1; }
.th { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.th.on { background: var(--user); }
.th small { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#top { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
#top .name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#menu { display: none; }
#log { flex: 1; overflow-y: auto; padding: 16px; }
.msg { max-width: 820px; margin: 0 auto 12px; white-space: pre-wrap; word-wrap: break-word; }
.msg.user { background: var(--user); padding: 10px 14px; border-radius: 12px; }
details.tool { max-width: 820px; margin: 0 auto 8px; background: var(--tool); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
details.tool summary { cursor: pointer; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
details.tool pre { white-space: pre-wrap; word-break: break-all; margin: 6px 0; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
.err { color: #dc2626; }
#composer { border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); }
#opts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
#opts select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; max-width: 46vw; }
#row { display: flex; gap: 8px; }
#text { flex: 1; resize: none; min-height: 44px; max-height: 40vh; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .5; }
@media (max-width: 720px) {
  #side { position: fixed; inset: 0 30% 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; }
  body.drawer #side { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.3); }
  #menu { display: inline-block; }
}
</style>
</head>
<body>
<aside id="side">
  <header><b>kron</b><button class="btn" id="new">New</button></header>
  <div id="threads"></div>
</aside>
<main id="main">
  <div id="top"><button class="btn" id="menu">☰</button><span class="name" id="tname">New thread</span></div>
  <div id="log"></div>
  <div id="composer">
    <div id="opts">
      <select id="mode" title="Mode">
        <option value="agent">Agent</option>
        <option value="chat">Chat</option>
        <option value="web">Web chat</option>
      </select>
      <select id="who" title="Provider / agent / site"></select>
      <select id="node" title="Where tools run"></select>
    </div>
    <div id="row">
      <textarea id="text" rows="1" placeholder="Message…"></textarea>
      <button class="btn primary" id="send">Send</button>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let token = new URLSearchParams(location.search).get('token') || localStorage.getItem('kron-token') || '';
if (token) localStorage.setItem('kron-token', token);
let info = null, thread = null, busy = false;

async function api(path, opts = {}) {
  opts.headers = Object.assign({'content-type': 'application/json'}, opts.headers, token ? {authorization: 'Bearer ' + token} : {});
  const r = await fetch(path, opts);
  if (r.status === 401) {
    token = prompt('Hub token') || '';
    localStorage.setItem('kron-token', token);
    return api(path, opts);
  }
  if (!r.ok) throw new Error(await r.text());
  return r;
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function scroll() { $('log').scrollTop = $('log').scrollHeight; }

function addTool(name, args, output) {
  const d = el('details', 'tool');
  let summary = args;
  try { const a = JSON.parse(args); summary = a.command || a.cmd || a.file_path || a.dir_path || a.pattern || a.query || a.task || args; } catch {}
  d.append(el('summary', null, name + '  ' + summary));
  const pre = el('pre', null, (args.length > 200 ? args + '\n\n' : '') + (output || ''));
  d.append(pre);
  $('log').append(d);
  return pre;
}

function render(records) {
  $('log').innerHTML = '';
  const outputs = {};
  for (const r of records) if (r.role === 'tool') outputs[r.call_id] = r.content;
  for (const r of records) {
    if (r.role === 'user') $('log').append(el('div', 'msg user', r.content));
    if (r.role === 'assistant') {
      if (r.text) $('log').append(el('div', 'msg', r.text));
      for (const tc of r.tool_calls || []) addTool(tc.name, JSON.stringify(tc.arguments), outputs[tc.id]);
    }
  }
  scroll();
}

async function loadThreads() {
  const list = await (await api('/api/threads')).json();
  const box = $('threads'); box.innerHTML = '';
  for (const t of list) {
    const d = el('div', 'th' + (t.name === thread ? ' on' : ''));
    d.append(el('div', null, t.title || t.name), el('small', null, t.name + ' · ' + new Date(t.updated).toLocaleString()));
    d.onclick = () => openThread(t.name);
    box.append(d);
  }
}

async function openThread(name) {
  thread = name; $('tname').textContent = name || 'New thread';
  document.body.classList.remove('drawer');
  if (name) render(await (await api('/api/threads/' + name)).json()); else $('log').innerHTML = '';
  loadThreads();
}

function fillWho() {
  const mode = $('mode').value, who = $('who');
  who.innerHTML = '';
  if (mode === 'web') {
    for (const s of info.sites) who.append(new Option(s, 'site:' + s));
  } else {
    for (const p of info.providers) who.append(new Option(p.name + ' · ' + p.model, 'provider:' + p.name));
    for (const a of info.agents) who.append(new Option('agent: ' + a, 'agent:' + a));
    who.value = 'provider:' + info.default;
  }
  const saved = localStorage.getItem('kron-who-' + mode);
  if (saved && [...who.options].some(o => o.value === saved)) who.value = saved;
}

async function loadInfo() {
  info = await (await api('/api/info')).json();
  const node = $('node'); node.innerHTML = '';
  for (const n of info.nodes) node.append(new Option('on ' + n.name + (n.browser ? '' : ' (no browser)'), n.name));
  const saved = localStorage.getItem('kron-node');
  if (saved && [...node.options].some(o => o.value === saved)) node.value = saved;
  $('mode').value = localStorage.getItem('kron-mode') || 'agent';
  fillWho();
}

async function send() {
  const text = $('text').value.trim();
  if (!text || busy) return;
  busy = true; $('send').disabled = true; $('text').value = '';
  const mode = $('mode').value, [kind, name] = $('who').value.split(/:(.*)/s);
  const body = {thread: thread || '', text, mode, node: $('node').value};
  if (kind === 'provider') body.provider = name;
  if (kind === 'agent') body.agent = name;
  if (kind === 'site') body.site = name;
  $('log').append(el('div', 'msg user', text)); scroll();
  let cur = null, pending = [];
  try {
    const run = await (await api('/api/runs', {method: 'POST', body: JSON.stringify(body)})).json();
    if (!thread) { thread = run.thread; $('tname').textContent = thread; }
    const r = await api('/api/runs/' + run.run + '/events');
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const data = chunk.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trimStart()).join('\n');
        if (!data) continue;
        const e = JSON.parse(data);
        if (e.type === 'text') { if (!cur) { cur = el('div', 'msg'); $('log').append(cur); } cur.textContent += e.content; }
        if (e.type === 'tool_start') { cur = null; pending.push({name: e.name, pre: addTool(e.name, e.args, '…')}); }
        if (e.type === 'tool_end') { const i = pending.findIndex(p => p.name === e.name); if (i >= 0) pending.splice(i, 1)[0].pre.textContent = e.output; }
        if (e.type === 'error') $('log').append(el('div', 'msg err', e.message));
        scroll();
      }
    }
  } catch (err) {
    $('log').append(el('div', 'msg err', String(err.message || err)));
  }
  busy = false; $('send').disabled = false;
  loadThreads();
}

$('send').onclick = send;
$('text').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(max-width: 720px)').matches) { e.preventDefault(); send(); } });
$('text').addEventListener('input', () => { const t = $('text'); t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; });
$('new').onclick = () => openThread(null);
$('menu').onclick = () => document.body.classList.toggle('drawer');
$('mode').onchange = () => { localStorage.setItem('kron-mode', $('mode').value); fillWho(); };
$('who').onchange = () => localStorage.setItem('kron-who-' + $('mode').value, $('who').value);
$('node').onchange = () => localStorage.setItem('kron-node', $('node').value);

loadInfo().then(() => openThread(null)).catch(e => $('log').append(el('div', 'msg err', e.message)));
</script>
</body>
</html>
